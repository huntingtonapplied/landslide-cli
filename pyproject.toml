[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "landslide-cli"
version = "0.1.0"
description = "Landslide platform CLI - interact with the Landslide REST API"
readme = "README.md"
license = "MIT"
requires-python = ">=3.8"
dependencies = [
    "click",
    "requests",
    "pyyaml",
    "tabulate",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[project.scripts]
landslide = "landslide_cli.main:main"

[tool.pytest.ini_options]
addopts = "-ra -q"
testpaths = ["tests"]
